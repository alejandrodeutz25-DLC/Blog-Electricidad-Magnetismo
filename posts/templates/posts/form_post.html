{% extends "posts/base.html" %}

{% block title %}{{ titulo_pagina }}{% endblock %}

{% block content %}
    <h2>{{ titulo_pagina }}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'lista_posts' %}">Cancelar</a></p>
{% endblock %}
