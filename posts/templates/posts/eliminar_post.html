{% extends "posts/base.html" %}

{% block title %}Eliminar post{% endblock %}

{% block content %}
    <h2>Eliminar post</h2>
    <p>¿Seguro que querés eliminar "{{ post.titulo }}"? Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <p><a href="{% url 'detalle_post' post.pk %}">Cancelar</a></p>
{% endblock %}
